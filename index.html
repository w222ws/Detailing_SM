    <!-- =========================================================
         Екран завантаження. Стилі вбудовані прямо сюди, щоб він
         з'являвся миттєво, ще до CSS і JS сайту.
         Суцільний чорний екран з колом, що крутиться. Коли сайт
         готовий, карбонові панелі йдуть вгору по черзі — наче
         знімають чохол з капота. Анімується тільки transform і opacity.
         Живе ПОЗА #root, щоб React його не чіпав.
         Мінімум показу 0.5с, максимум 4с.
         ========================================================= -->
    <style>
      html,
      body {
        margin: 0;
        background: #07070a;
        color: #f4f5f8;
      }

      html.is-loading {
        overflow: hidden;
      }

      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
      }

      #preloader.is-done {
        pointer-events: none;
      }

      /* Заслінка: дві суцільні половини фірмового тёмного. Коли сайт
         готовий — роз'їжджаються в боки, як ворота боксу. */
      .pl-strips {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .pl-half {
        background: #07070a;
        transition: transform 0.85s cubic-bezier(0.76, 0, 0.24, 1);
      }
      .pl-half-r {
        margin-left: -1px;
      }
      #preloader.is-done .pl-half-l {
        transform: translateX(-101%);
      }
      #preloader.is-done .pl-half-r {
        transform: translateX(101%);
      }

      /* Кружок, що крутиться */
      .pl-ring {
        position: relative;
        width: 50px;
        height: 50px;
        transition:
          opacity 0.25s ease,
          transform 0.25s ease;
      }
      #preloader.is-done .pl-ring {
        opacity: 0;
        transform: scale(0.7);
      }
      .pl-ring svg {
        display: block;
        width: 100%;
        height: 100%;
        animation: pl-spin 0.9s linear infinite;
      }
      @keyframes pl-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (min-width: 48rem) {
        .pl-ring {
          width: 56px;
          height: 56px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .pl-ring svg {
          animation-duration: 3s;
        }
        .pl-half,
        .pl-ring {
          transition-duration: 0.01ms;
          transition-delay: 0ms !important;
        }
      }
    </style>

    <!--
      Прибирає екран завантаження, коли готові: сторінка, шрифти й головне
      фото. Мінімум 500мс (щоб не мигало), максимум 4с (щоб не зависнути).
      Подію "app:ready" шле, коли панелі вже пішли вгору: по ній Hero може
      запускати свої анімації.
    -->
    <script>
      (function () {
        var html = document.documentElement;
        var pre = document.getElementById('preloader');
        if (!pre) {
          html.classList.remove('is-loading');
          return;
        }

        var started = performance.now();
        var MIN = 500;
        var MAX = 4000;
        var finished = false;

        function finish() {
          if (finished) return;
          finished = true;
          var wait = Math.max(0, MIN - (performance.now() - started));
          setTimeout(function () {
            pre.classList.add('is-done');
            setTimeout(function () {
              html.classList.remove('is-loading');
              window.dispatchEvent(new Event('app:ready'));
            }, 300);
            setTimeout(function () {
              pre.remove();
            }, 1400);
          }, wait);
        }

        var loaded = new Promise(function (resolve) {
          if (document.readyState === 'complete') resolve();
          else window.addEventListener('load', resolve, { once: true });
        });

        function fonts() {
          if (!document.fonts || !document.fonts.load) return Promise.resolve();
          return Promise.all([
            document.fonts.load('900 1em "Sofia Sans Extra Condensed"'),
            document.fonts.load('400 1em "Onest"'),
          ]).catch(function () {});
        }

        function heroImage() {
          return new Promise(function (resolve) {
            var tries = 0;
            (function look() {
              var img = document.querySelector('#root img');
              if (img) {
                if (img.complete) return resolve();
                img.addEventListener('load', resolve, { once: true });
                img.addEventListener('error', resolve, { once: true });
                return;
              }
              if (++tries > 30) return resolve();
              setTimeout(look, 50);
            })();
          });
        }

        loaded.then(fonts).then(heroImage).then(finish);
        setTimeout(finish, MAX);
      })();
    </script>
